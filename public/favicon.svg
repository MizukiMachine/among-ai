  <!-- eyes -->
  <ellipse cx="12.5" cy="17" rx="2" ry="1.5" fill="#fbbf24"/>
  <ellipse cx="19.5" cy="17" rx="2" ry="1.5" fill="#fbbf24"/>
  <ellipse cx="12.5" cy="17" rx="1" ry="1.2" fill="#1e1b4b"/>
  <ellipse cx="19.5" cy="17" rx="1" ry="1.2" fill="#1e1b4b"/>
  <!-- snout -->
  <path d="M14,21 Q16,25 18,21 L16,20 Z" fill="#ddd6fe"/>
  <!-- mouth -->
  <path d="M13,23 Q16,25 19,23" fill="none" stroke="#1e1b4b" stroke-width="0.8"/>
  <!-- nose -->
  <ellipse cx="16" cy="20.5" rx="1" ry="0.6" fill="#1e1b4b"/>
</svg>
