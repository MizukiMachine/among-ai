services:
  - type: web
    name: among-ai
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: ZAI_API_KEY
        sync: false
      - key: ZAI_MODEL
        value: glm-5-turbo
      - key: ZAI_BASE_URL
        value: https://api.z.ai/api/anthropic
      - key: ZAI_TIMEOUT_MS
        value: "45000"
      - key: AMONG_AI_HUMAN_OPTIONAL_INPUT_TIMEOUT_MS
        value: "45000"
      - key: AMONG_AI_STREAM_HEARTBEAT_MS
        value: "15000"
      - key: AMONG_AI_STREAM_WATCHDOG_MS
        value: "30000"
